name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - 'scripts/**'
      - 'website/**'
      - 'website.old/**'
      - 'uat-repos/**'
      - 'TestData/**'
      - 'assets/**'
      - 'artifacts/**'

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# CI Optimization: Tests removed from this workflow to eliminate redundancy.
# All quality gates (format, build, test, lint, vulnerability scan) run in PR Validation.
# This workflow only handles versioning after merge, reducing CI time significantly.
jobs:
  version:
    name: Version and Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Go (for govulncheck and tooling)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22'

      - name: Install Versionize
        run: |
          # Install Versionize from GitHub releases (standalone binary — no SDK needed)
          VERSIONIZE_VERSION="5.0.0"
          # SHA256 checksum for versionize-linux-x64 v5.0.0 (update when bumping VERSIONIZE_VERSION)
          EXPECTED_SHA256="e8c4fa81cc7f40a1e773aed4553f7f059e8b1a2baa07c8b7e08d46adae5c3a8f"
          DOWNLOAD_PATH="$(mktemp)"
          curl -sSfL "https://github.com/versionize/versionize/releases/download/${VERSIONIZE_VERSION}/versionize-linux-x64" \
            -o "$DOWNLOAD_PATH"
          ACTUAL_SHA256="$(sha256sum "$DOWNLOAD_PATH" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Checksum mismatch for versionize-linux-x64 v${VERSIONIZE_VERSION}"
            echo "  Expected: ${EXPECTED_SHA256}"
            echo "  Actual:   ${ACTUAL_SHA256}"
            rm -f "$DOWNLOAD_PATH"
            exit 1
          fi
          mv "$DOWNLOAD_PATH" /usr/local/bin/versionize
          chmod +x /usr/local/bin/versionize

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect release-worthy changes
        id: release_needed
        run: |
          set -euo pipefail

          # We only want to create a new version/tag when the published Docker image
          # would actually change. The final image contains the Go binary and
          # some example files (see Dockerfile).
          #
          # This check is intentionally conservative and focuses on files that can
          # affect the final runtime image contents.
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            echo "No previous v* tag found; allowing versionize to run."
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last tag: $last_tag"
          changed=$(git diff --name-only "$last_tag"..HEAD || true)
          if [ -z "$changed" ]; then
            echo "No changes detected since $last_tag; skipping versionize."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Paths that can affect the published Docker image
          # Monitors src-go/ for the Go implementation
          releasable=$(echo "$changed" | grep -E '^(src-go/|src/|examples/|\.dockerignore$)' || true)

          # Exclude paths that do not change the published runtime image (but may still affect build/test).
          # We intentionally do NOT create new tags/releases for test-only or generated test output changes.
          releasable=$(echo "$releasable" | grep -Ev '^(src-go/.*_test\.go$|src/tests/|src/tools/|src/TestResults/|src/src/TestResults/)' || true)
          if [ -z "$releasable" ]; then
            echo "Only non-release-impacting files changed since $last_tag; skipping versionize."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release-impacting changes detected:"
          echo "$releasable"
          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      - name: Check for pre-set version
        id: version_check
        if: steps.release_needed.outputs.release_needed == 'true'
        run: |
          set -euo pipefail

          # Read version from VERSION file if it exists; otherwise fall back to 0.0.0
          if [ -f VERSION ]; then
            FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            FILE_VERSION="0.0.0"
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          LAST_TAG_VERSION=${LAST_TAG#v}

          echo "file_version=$FILE_VERSION"
          echo "last_tag_version=$LAST_TAG_VERSION"

          # If the VERSION file is ahead of the latest tag AND no tag exists for that
          # version, the version was corrected manually. In this case, skip Versionize
          # and create the tag directly from the pre-set version.
          if [ "$FILE_VERSION" != "$LAST_TAG_VERSION" ] && [ "$FILE_VERSION" != "0.0.0" ]; then
            # Verify the file version is HIGHER than the last tag (not a downgrade)
            HIGHER=$(printf '%s\n%s' "$LAST_TAG_VERSION" "$FILE_VERSION" | sort -V | tail -n1)
            if [ "$HIGHER" != "$FILE_VERSION" ]; then
              echo "Warning: VERSION file $FILE_VERSION is not higher than tag $LAST_TAG; ignoring"
              echo "pre_set=false" >> "$GITHUB_OUTPUT"
            elif ! git rev-parse "v$FILE_VERSION" >/dev/null 2>&1; then
              echo "Pre-set version detected: VERSION=$FILE_VERSION vs tag=$LAST_TAG"
              echo "pre_set=true" >> "$GITHUB_OUTPUT"
              echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$FILE_VERSION already exists, skipping"
              echo "pre_set=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Version matches latest tag, Versionize will determine next version"
            echo "pre_set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag pre-set version
        id: pre_set_tag
        if: steps.version_check.outputs.pre_set == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          git tag "v$VERSION"
          echo "Created tag v$VERSION for pre-set version (manual version correction)"

      - name: Versionize
        id: versionize
        if: steps.release_needed.outputs.release_needed == 'true' && steps.version_check.outputs.pre_set != 'true'
        run: |
          versionize --exit-insignificant-commits --skip-dirty
          echo "version_bumped=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Amend commit message with [skip ci]
        if: steps.versionize.outcome == 'success'
        run: |
          # Get the current commit message (preserving multi-line format)
          # Use RUNNER_TEMP for reliable temporary directory in GitHub Actions
          git log -1 --pretty=%B > "$RUNNER_TEMP/commit-msg.txt"
          
          # Validate that we got a commit message
          if [ ! -s "$RUNNER_TEMP/commit-msg.txt" ]; then
            echo "Error: Failed to read commit message"
            exit 1
          fi
          
          # Append [skip ci] to the first line to prevent workflows from triggering
          # GitHub Actions checks the first line or commit title for skip ci markers
          FIRST_LINE=$(head -n1 "$RUNNER_TEMP/commit-msg.txt")
          
          # Validate first line is not empty
          if [ -z "$FIRST_LINE" ]; then
            echo "Error: Commit message first line is empty"
            exit 1
          fi
          
          # Write the amended first line
          echo "$FIRST_LINE [skip ci]" > "$RUNNER_TEMP/commit-msg-amended.txt"
          
          # Append remaining lines if they exist (preserving multi-line structure)
          if [ "$(wc -l < "$RUNNER_TEMP/commit-msg.txt")" -gt 1 ]; then
            tail -n +2 "$RUNNER_TEMP/commit-msg.txt" >> "$RUNNER_TEMP/commit-msg-amended.txt"
          fi
          
          # Store the tag name before amending (versionize creates tag like v1.11.0)
          TAG_NAME=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          
          # Amend the commit with the modified message
          git commit --amend -F "$RUNNER_TEMP/commit-msg-amended.txt"
          echo "Amended commit message to include [skip ci]"
          
          # Move the tag to the amended commit if a tag was present
          if [ -n "$TAG_NAME" ]; then
            echo "Moving tag $TAG_NAME to amended commit"
            git tag -f "$TAG_NAME"
          fi

      - name: Push changes
        if: steps.versionize.outcome == 'success' || steps.pre_set_tag.outcome == 'success'
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # Use RELEASE_TOKEN to bypass branch protection
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git"

          if [ "${{ steps.versionize.outcome }}" = "success" ]; then
            # Versionize created a new commit + tag: push both (separately)
            # Push commit without following tags to avoid pushing the tag prematurely
            git push --no-follow-tags origin HEAD

            TAG_NAME=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
            if [ -n "$TAG_NAME" ]; then
              echo "Pushing tag $TAG_NAME separately to trigger Release workflow"
              git push origin "$TAG_NAME"
            fi
          elif [ "${{ steps.pre_set_tag.outcome }}" = "success" ]; then
            # Pre-set version: only push the tag (no new commit was created)
            TAG_NAME="v${{ steps.version_check.outputs.version }}"
            echo "Pushing pre-set tag $TAG_NAME to trigger Release workflow"
            git push origin "$TAG_NAME"
          fi
