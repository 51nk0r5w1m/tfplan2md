name: Coverage Data

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Update coverage badge/history branch
    runs-on: ubuntu-latest
    # Only run when Go source exists
    if: hashFiles('src-go/go.mod') != ''
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'src-go/go.mod'
          cache-dependency-path: 'src-go/go.sum'

      - name: Test (with coverage)
        run: |
          cd src-go
          # Exclude Docker-based tests to keep this job fast and stable
          go test -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -run "^Test[^Docker]" \
            ./...
          go tool cover -func=coverage.out > coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html

      - name: Generate coverage badge (staging)
        run: |
          mkdir -p .tmp/coverage
          total=$(grep "^total:" src-go/coverage-summary.txt | awk '{print $3}' | tr -d '%')
          timestamp="${{ github.event.head_commit.timestamp }}"
          if [ -z "$timestamp" ]; then
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          # Generate SVG badge
          colour="brightgreen"
          if (( $(echo "$total < 50" | bc -l) )); then colour="red"
          elif (( $(echo "$total < 70" | bc -l) )); then colour="orange"
          elif (( $(echo "$total < 80" | bc -l) )); then colour="yellow"
          fi
          cat > .tmp/coverage/coverage-badge.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="20">
            <title>coverage: ${total}%</title>
          </svg>
          SVG

          # Append to JSON history
          echo "{\"sha\":\"${{ github.sha }}\",\"timestamp\":\"${timestamp}\",\"coverage\":${total}}" \
            >> .tmp/coverage/history.json

      - name: Publish to coverage-data branch
        env:
          TARGET_BRANCH: coverage-data
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET_BRANCH" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout --orphan "$TARGET_BRANCH"
            git rm -rf . || true
          fi

          mkdir -p assets docs/coverage
          cp ./.tmp/coverage/coverage-badge.svg ./assets/coverage-badge.svg
          cp ./.tmp/coverage/history.json ./docs/coverage/history.json

          git add assets/coverage-badge.svg docs/coverage/history.json

          if git diff --cached --quiet; then
            echo "No coverage changes to publish."
            exit 0
          fi

          git commit -m "docs: update coverage badge and history"
          git push origin "$TARGET_BRANCH"
