name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: "Guardrail: internal/workflow PRs must not bump versions"
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          if [ -z "$changed_files" ]; then
            echo "No changed files detected; skipping internal commit guardrail."
            exit 0
          fi

          # If anything outside these paths changed, this is not an internal-only PR.
          non_internal=$(echo "$changed_files" | grep -Ev '^(\.github/|scripts/|docs/|website/|website\.old/|uat-repos/|TestData/|artifacts/|assets/)' || true)
          # .github/workflows/ files are pipeline/release code, not pure tooling; treat them as non-internal
          # (consistent with the "Check if validation is needed" step, which does NOT ignore them).
          workflow_changed=$(echo "$changed_files" | grep -E '^\.github/workflows/' || true)
          if [ -n "$non_internal" ] || [ -n "$workflow_changed" ]; then
            echo "Non-internal files changed; internal commit guardrail not applicable."
            exit 0
          fi

          echo "Internal-only PR detected; enforcing non-version-bumping commit types."

          # Versionize bumps on conventional commits like feat/fix (and breaking changes).
          messages=$(git log --format=%B "$BASE_SHA".."$HEAD_SHA" || true)

          if echo "$messages" | grep -Eqi '^(feat|fix|perf)(\([^)]*\))?:|BREAKING CHANGE:'; then
            echo "❌ ERROR: This PR only changes internal/workflow/tooling files, but includes version-bumping commits (feat/fix/perf or BREAKING CHANGE)."
            echo "Please use non-bumping types like chore:, ci:, docs:, style:, refactor: for internal changes."
            exit 1
          fi

          echo "✓ Commit messages OK for internal-only PR."

      - name: Check if validation is needed
        id: filter
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "website_changed=false" >> $GITHUB_OUTPUT
            echo "No changed files detected; running validation"
            exit 0
          fi

          WEBSITE_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^website/' || true)
          if [ -n "$WEBSITE_CHANGED" ]; then
            echo "website_changed=true" >> $GITHUB_OUTPUT
          else
            echo "website_changed=false" >> $GITHUB_OUTPUT
          fi

          NON_IGNORED=$(echo "$CHANGED_FILES" | grep -Ev '^(docs/|website/|website\.old/|\.github/agents/|\.github/skills/|\.github/copilot-instructions\.md$|\.github/gh-cli-instructions\.md$|\.github/pull_request_template\.md$)' || true)

          if [ -z "$NON_IGNORED" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Only docs/website/website.old/agent-instructions changed; skipping non-website validation"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Non-ignored files changed; running validation"
          fi

      - name: Setup Node
        if: steps.filter.outputs.website_changed == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Website dependencies
        if: steps.filter.outputs.website_changed == 'true'
        working-directory: website
        run: npm ci

      - name: Verify Website
        if: steps.filter.outputs.website_changed == 'true'
        run: scripts/website-verify.sh --all

      - name: Snapshot integrity guardrail
        if: steps.filter.outputs.changed == 'true'
        run: scripts/validate-snapshot-changes.sh --base-ref "${{ github.event.pull_request.base.sha }}" --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Release notes guardrail
        if: steps.filter.outputs.changed == 'true'
        run: scripts/validate-release-notes.sh --base-ref "${{ github.event.pull_request.base.sha }}" --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Shell test (timeout wrapper)
        if: steps.filter.outputs.changed == 'true'
        run: src/tests/shell/test_with_timeout_test.sh

      - name: Shell test (analyze chat)
        if: steps.filter.outputs.changed == 'true'
        run: src/tests/shell/analyze_chat_test.sh

      - name: Shell test (validate release notes)
        if: steps.filter.outputs.changed == 'true'
        run: src/tests/shell/validate_release_notes_test.sh

      - name: Setup Go
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'src-go/go.mod'
          cache-dependency-path: 'src-go/go.sum'

      - name: Go build
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        run: |
          cd src-go
          CGO_ENABLED=0 go build ./...

      - name: Go lint (golangci-lint)
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: src-go
          version: v1.61.0

      - name: Go test
        id: go_test
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        run: |
          cd src-go
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Enforce Go coverage threshold
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        run: |
          total=$(grep "^total:" src-go/coverage-summary.txt | awk '{print $3}' | tr -d '%')
          threshold=80
          if (( $(echo "$total < $threshold" | bc -l) )); then
            echo "❌ Go coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "✓ Go coverage: ${total}% (threshold: ${threshold}%)"

      - name: Upload Go coverage report
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != '' && (success() || failure())
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: go-coverage
          path: |
            src-go/coverage.out
            src-go/coverage-summary.txt

      - name: Check for vulnerable Go packages
        if: steps.filter.outputs.changed == 'true' && hashFiles('src-go/go.mod') != ''
        run: |
          cd src-go
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Skip validation (no relevant files changed)
        if: steps.filter.outputs.changed == 'false'
        run: echo "✅ PR validation skipped for non-code checks (docs/website/website.old/agent-only changes)"
